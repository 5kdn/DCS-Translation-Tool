# ------------------------------------------------------------
# Purpose:
#   - 依存の自動更新（セキュリティ & 定期）
# ------------------------------------------------------------
version: 2

updates:

# ─────────────────────────────────────────────────────────
# 1) GitHub Actions のアクション更新を監視
# ─────────────────────────────────────────────────────────
- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: "weekly"
    time: "03:20"
    timezone: "Asia/Tokyo"
  labels:
    - "dependencies"
    - "ci"
  commit-message:
    prefix: "chore"
    include: "scope"

# ─────────────────────────────────────────────────────────
# 2) NuGet パッケージを監視
#    - Dependabot は .csproj / .props / .targets / packages.config を解析
#    - net8.0 指定のプロジェクトでも、互換範囲内の最新を提案
# ─────────────────────────────────────────────────────────
- package-ecosystem: "nuget"
  directory: "/"
  schedule:
    interval: "weekly"     # daily / weekly / monthly
    time: "03:40"
    timezone: "Asia/Tokyo"
  target-branch: "master"
  labels:
    - "dependencies"
    - "NuGet"
  versioning-strategy: increase
  open-pull-requests-limit: 10
  rebase-strategy: "auto"
  commit-message:
    prefix: "chore"
    include: "scope"
  groups:
    app-core:
      patterns:
        - "Caliburn.Micro"
        - "MaterialDesignThemes*"
        - "FluentResults"
        - "Microsoft.Data.Sqlite"
        - "NLog"
        - "UTF.Unknown"
      update-types:
        - "minor"
        - "patch"
    kiota:
      patterns:
        - "Microsoft.Kiota.*"
      update-types:
        - "minor"
        - "patch"
    testing:
      patterns:
        - "coverlet.collector"
        - "Microsoft.NET.Test.Sdk"
        - "Moq"
        - "WireMock.Net"
        - "xunit.runner.visualstudio"
        - "Xunit.StaFact"
        - "xunit.v3"
      update-types:
        - "minor"
        - "patch"
