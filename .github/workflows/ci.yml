# ------------------------------------------------------------
# Workflow Name : CI
# Trigger       : pull_request to master / weekly schedule
# Purpose       :
#   - 変更に対して Lint / UnitTest / updater E2E を実行
# ------------------------------------------------------------
name: CI

on:
  schedule:
    - cron: '0 3 * * 1'
  pull_request:
    branches:
      - master
    paths:
      - '**/*.cs'
      - '**/*.csproj'
      - '**/*.props'
      - '**/*.sln'
      - '**/*.targets'
      - '**/*.xaml'
      - 'build/**/*.ps1'
      - '.editorconfig'
      - '.github/workflows/**'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'NuGet.config'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: 1

jobs:

  Lint:
    name: Lint
    runs-on: windows-latest
    strategy:
      matrix:
        dotnet-version: ["8.0.x"]
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup .NET ${{ matrix.dotnet-version }}
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ matrix.dotnet-version }}
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            **/Directory.Packages.props
            global.json
            NuGet.config

      - name: Restore
        shell: pwsh
        run: dotnet restore --locked-mode

      - name: Formatting
        shell: pwsh
        run: >
          dotnet format
          --no-restore
          --verify-no-changes
          --verbosity normal

  Unit:
    name: Unit Tests
    runs-on: windows-latest
    strategy:
      matrix:
        dotnet-version: ["8.0.x"]
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup .NET ${{ matrix.dotnet-version }}
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ matrix.dotnet-version }}
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            **/Directory.Packages.props
            global.json
            NuGet.config

      - name: Restore
        shell: pwsh
        run: dotnet restore --locked-mode

      - name: Build
        shell: pwsh
        run: >
          dotnet build
          -c Release
          --no-restore
          --nologo

      - name: Unit Tests
        shell: pwsh
        run: >
          dotnet test
          -c Release
          --no-build
          --no-restore

  End-to-end:
    name: End-to-end (${{ matrix.runtime-identifier }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runtime-identifier: [win-x64, win-x86]
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup .NET 8.0.x
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            **/Directory.Packages.props
            global.json
            NuGet.config

      - name: Application update E2E
        shell: pwsh
        run: ./build/Invoke-ApplicationUpdateE2e.ps1 -RuntimeIdentifier ${{ matrix.runtime-identifier }}

      - name: Upload E2E diagnostics
        if: failure() || cancelled()
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: application-update-e2e-${{ matrix.runtime-identifier }}
          path: artifacts/e2e/${{ matrix.runtime-identifier }}
          if-no-files-found: warn
          retention-days: 14
