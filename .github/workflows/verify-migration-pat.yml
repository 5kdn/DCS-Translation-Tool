name: Verify migration PAT (read only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  Verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify saved PAT access without printing the token
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          gh api --silent "repos/$GITHUB_REPOSITORY"
          gh api --silent "repos/$GITHUB_REPOSITORY/releases?per_page=1"
          gh api --silent "repos/$GITHUB_REPOSITORY/pulls?per_page=1"
          gh api --silent "repos/$GITHUB_REPOSITORY/issues?per_page=1"
          gh api --silent "repos/$GITHUB_REPOSITORY/immutable-releases"
          echo 'Saved PAT read access verified. Write permissions and expiry require separate approval and verification.' >> "$GITHUB_STEP_SUMMARY"
