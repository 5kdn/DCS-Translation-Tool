# ------------------------------------------------------------
# Workflow Name : release-please
# Trigger       : push to master / workflow_dispatch
# Purpose       :
#   - 変更に対してリリースを管理する
# ------------------------------------------------------------
name: release-please

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      release_tag: ${{ steps.rp.outputs.tag_name }}
      release_sha: ${{ steps.rp.outputs.sha }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Run Release Please
        uses: googleapis/release-please-action@v5
        id: rp
        with:
          # see also https://github.com/googleapis/release-please-action#release-types-supported
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.PAT }}

  publish-release:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/publish-to-GitHub-Release.yml
    with:
      release-tag: ${{ needs.release-please.outputs.release_tag }}
      release-sha: ${{ needs.release-please.outputs.release_sha }}
    secrets:
      PAT: ${{ secrets.PAT }}
